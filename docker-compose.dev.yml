services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contentfirewall
      POSTGRES_USER: contentfirewall
      POSTGRES_PASSWORD: contentfirewall
    ports:
      - "5433:5432"
    volumes:
      - contentfirewall-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  contentfirewall-postgres:
